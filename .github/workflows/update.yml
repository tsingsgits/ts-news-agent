name: Update T's News Agent

on:
  schedule:
    # Primary trigger is a Claude scheduled task at 5:41 AM Pacific (workflow_dispatch).
    # This GitHub schedule is only a backup: GitHub often starts it hours late, and the
    # guard step below skips it if today's brief has already been built and emailed.
    - cron: '0 13 * * *'
  workflow_dispatch: {}   # lets you trigger a manual run from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Skip backup run if today's brief already went out
        id: guard
        if: github.event_name == 'schedule'
        run: |
          last=$(TZ=America/Los_Angeles git log -1 --format=%cd --date=format-local:%Y-%m-%d -- index.html)
          today=$(TZ=America/Los_Angeles date +%Y-%m-%d)
          echo "Last page build: $last (Pacific). Today: $today."
          if [ "$last" = "$today" ]; then
            echo "Already ran today; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Fetch feeds and build page
        if: steps.guard.outputs.skip != 'true'
        env:
          # Inbox the market newsletters are delivered to (Gmail address + app password).
          # If these secrets are missing, the Briefings tile just says it isn't connected.
          NEWSLETTER_IMAP_USER: ${{ secrets.NEWSLETTER_IMAP_USER }}
          NEWSLETTER_IMAP_PASSWORD: ${{ secrets.NEWSLETTER_IMAP_PASSWORD }}
        run: python scripts/fetch_news.py

      - name: Commit and push if changed
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "news-agent-bot"
          git config user.email "actions@github.com"
          git add index.html email.html
          git diff --quiet --cached || git commit -m "Daily update: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

      - name: Email the page
        if: steps.guard.outputs.skip != 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "T's News Agent - daily brief"
          to: ${{ secrets.MAIL_TO }}
          from: "T's News Agent <${{ secrets.MAIL_USERNAME }}>"
          html_body: file://email.html
